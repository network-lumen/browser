<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lumen Browser</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Declaring a colour scheme is what stops Android WebView from deciding on
      one for us. The activity theme is Theme.AppCompat.DayNight, and a page
      that declares nothing gets algorithmic darkening: the WebView reinterprets
      the colours itself, which mangles gradients and currentColor-stroked SVG -
      a white icon on a gradient badge ends up white on white, which is exactly
      how every popup header lost its icon on Android while Chromium was fine.

      The app owns its theming (src/composables/useTheme.ts puts .dark/.system on
      :root), so both schemes are genuinely supported and saying so is accurate.
      Harmless on the desktop, where nothing was darkening anything.
    -->
    <meta name="color-scheme" content="light dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob: file: http: https: ws: wss:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: http: https:; font-src 'self' data: blob: file: http: https:; media-src 'self' data: blob: file: http: https:; connect-src 'self' data: blob: file: http: https: ws: wss:; worker-src 'self' blob:; child-src 'self' data: blob: file: http: https:; frame-src 'self' data: blob: file: http: https:; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
  </head>
  <body>
    <div id="app" class="min-h-100vh"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
